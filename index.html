<style>
/* Layout: photos first on a near-black ground so fisheye vignettes melt into the page. Mostly pairs, generous gaps. */
:root{
  --ground:#ffffff; --ink:#111111; --muted:#757575; --line:#e6e6e6; --raised:#f0f0f0;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --gap:0px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{padding-inline:0;padding-block:0 var(--gap)}
a{color:inherit}
a:focus-visible,figure:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

header{padding:28px clamp(10px,1.8vw,28px) 36px;line-height:1.5}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 a{text-decoration:none}
header p{margin:0;color:var(--muted)}
header .links{margin-top:20px;display:flex;flex-direction:column;align-items:flex-start}
header .links a,header .links span{text-decoration:none;color:var(--muted)}
header .links a:hover{color:var(--ink)}
header .links .sel{user-select:all}
@media (max-width:720px){header{text-align:center}header .links{align-items:center}}


h2{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 14px}

.row{display:flex;gap:var(--gap);margin-bottom:var(--gap)}
figure{margin:0;min-width:0;cursor:zoom-in}
figure img{display:block;width:100%;height:auto;background:var(--raised)}
/* no gaps between photos: overlap neighbours by 1px so browser rounding can never leave a hairline */
.row+.row{margin-top:-1px}
.row figure+figure{margin-left:-1px}
@media (max-width:720px){.row{flex-direction:column}.row figure{flex:none!important}.row figure+figure{margin-left:0;margin-top:-1px}}

.contact{display:flex;flex-wrap:wrap;gap:8px 32px;border-top:1px solid var(--line);padding-top:16px}
.contact a{text-decoration:none}
.contact a:hover{text-decoration:underline}
.contact .sel{user-select:all}
.small{color:var(--muted);margin-top:24px;font-size:13px}

.lb{position:fixed;inset:0;z-index:20;background:#fff;display:flex;align-items:center;justify-content:center;padding:max(48px,env(safe-area-inset-top,0px)) 16px max(48px,env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb video{width:100%;height:100%;object-fit:contain;display:block;background:transparent}
figure[style*="cursor:default"]{cursor:zoom-in!important}
.lb button{position:absolute;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;padding:14px}
.lb .x{top:max(4px,env(safe-area-inset-top,0px));right:4px}
.lb .p{left:0;top:50%;transform:translateY(-50%)} .lb .n{right:0;top:50%;transform:translateY(-50%)}
/* lightbox controls */
figure,.lb,.lb *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
figure img,figure video,.lb img,.lb video{-webkit-user-drag:none}
.lb ::selection,figure ::selection{background:transparent}
.lb .p,.lb .n{width:60px;height:60px;padding:0;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);border:1px solid var(--ink);z-index:2}
.lb .p{left:12px}.lb .n{right:12px}
.lb .p:hover,.lb .n:hover,.lb .x:hover{background:var(--ink);color:var(--ground)}
.lb .x{top:12px;right:12px;padding:12px 20px;font-size:16px;font-weight:600;background:rgba(255,255,255,.9);border:1px solid var(--ink);z-index:2}
@media (max-width:720px){.lb .p,.lb .n{width:48px;height:48px;font-size:24px}.lb .p{left:8px}.lb .n{right:8px}}
</style>

playsinline preload="auto" style="display:block;width:100%;height:auto;background:var(--raised)" aria-label="ILO Studios movement"></video></figure></div><div class="row"><figure style="flex:1.7778 1 0;cursor:default"><video src="sea-swim.mp4" autoplay muted loop playsinline preload="auto" style="display:block;width:100%;height:auto;background:var(--raised)" aria-label="Sea swim at dusk"></video></figure><figure style="flex:1.7778 1 0;cursor:default"><video src="sea-wave.mp4" autoplay muted loop playsinline preload="auto" style="display:block;width:100%;height:auto;background:var(--raised)" aria-label="Shoreline at dusk"></video></figure></div><div class="row shoot"><figure style="flex:1.5000 1 0"><img src="img-12.jpg" width="1500" height="1000" alt="Collab tee, full length" loading="lazy" decoding="async"></figure></div><div class="row"><figure style="flex:0.8000 1 0"><img src="img-13.jpg" width="960" height="1200" alt="California Sports Gear, back" loading="lazy" decoding="async"></figure><figure style="flex:0.6669 1 0"><img src="img-14.jpg" width="867" height="1300" alt="Zoom burst" loading="lazy" decoding="async"></figure></div><div class="row shoot"><figure style="flex:0.6671 1 0"><img src="img-15.jpg" width="934" height="1400" alt="Puffer jacket, V wall" loading="lazy" decoding="async"></figure><figure style="flex:0.6671 1 0"><img src="img-16.jpg" width="934" height="1400" alt="Puffer jacket, seated" loading="lazy" decoding="async"></figure></div><div class="row"><figure style="flex:0.6671 1 0"><img src="img-17.jpg" width="934" height="1400" alt="Tank top, sand at night" loading="lazy" decoding="async"></figure><figure style="flex:0.6671 1 0"><img src="img-18.jpg" width="934" height="1400" alt="Puffer jacket, looking back" loading="lazy" decoding="async"></figure></div>
  </main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="lbimg" alt=""><video id="lbvid" playsinline loop hidden></video>
  <button class="x" id="lbx" type="button">Close</button>
  <button class="p" id="lbp" type="button" aria-label="Previous">←</button>
  <button class="n" id="lbn" type="button" aria-label="Next">→</button>
</div>

<script>
(function(){
  var figs=[].slice.call(document.querySelectorAll('figure')).filter(function(f){return f.querySelector('img,video')}),i=0,lb=document.getElementById('lb'),im=document.getElementById('lbimg'),vd=document.getElementById('lbvid'),last=null;
  function stopv(){vd.pause();vd.removeAttribute('src');vd.removeAttribute('poster');vd.load();}
  function show(k){i=(k+figs.length)%figs.length;var f=figs[i],v=f.querySelector('video'),s=f.querySelector('img');
    if(v){im.hidden=true;vd.hidden=false;vd.poster=v.getAttribute('poster')||'';vd.src=v.getAttribute('src');vd.controls=false;var p=vd.play();if(p&&p.catch)p.catch(function(){vd.muted=true;vd.play()})}
    else{stopv();vd.hidden=true;im.hidden=false;im.src=s.src;im.alt=s.alt}}
  function open(k){last=document.activeElement;show(k);lb.hidden=false;document.body.style.overflow='hidden';document.getElementById('lbx').focus();}
  function close(){stopv();lb.hidden=true;document.body.style.overflow='';if(last)last.focus();}
  figs.forEach(function(f,k){f.tabIndex=0;f.addEventListener('click',function(){open(k)});f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(k)}})});
  document.getElementById('lbx').onclick=close;
  vd.onclick=function(e){e.stopPropagation();if(vd.controls)return;var z=zone(e);if(z){show(i+z);return}if(vd.paused)vd.play();else vd.pause()};
  vd.addEventListener('pause',function(){if(vd.hidden||!vd.getAttribute('src')||vd.ended)return;vd.controls=true});
  vd.addEventListener('play',function(){vd.controls=false});
  document.getElementById('lbp').onclick=function(e){e.stopPropagation();show(i-1)};
  document.getElementById('lbn').onclick=function(e){e.stopPropagation();show(i+1)};
  function zone(e){var w=window.innerWidth;return e.clientX<w*0.3?-1:e.clientX>w*0.7?1:0}
  lb.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')return;var z=zone(e);if(z){show(i+z);return}if(e.target===lb)close()});
  document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});
  var sx=null,sy=null;lb.addEventListener('touchstart',function(e){if(e.target===vd&&vd.controls){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  lb.addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx,v=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(v)>60&&Math.abs(v)>Math.abs(d)){close();return}if(Math.abs(d)>50)show(d<0?i+1:i-1)});
})();
</script>
